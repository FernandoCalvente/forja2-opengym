name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in .env}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Forja gamification: missions/XP/rank/friends/events, layered on top of openGym.
  # Only talks to `api` over /internal/* (never touches ./data itself) and to its own
  # Postgres. See /datos/forja2/gamer-api/README (TODO) for the port rationale.
  gamer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gamer
      - POSTGRES_PASSWORD=${GAMER_DB_PASSWORD:?set GAMER_DB_PASSWORD in .env}
      - POSTGRES_DB=gamer
    volumes:
      - gamer_pgdata:/var/lib/postgresql/data
      - ../db/gamification/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamer -d gamer"]
      interval: 5s
      timeout: 3s
      retries: 10

  gamer-api:
    build: ../gamer-api
    restart: unless-stopped
    depends_on:
      gamer-db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - PORT=3100
      - DATABASE_URL=postgres://gamer:${GAMER_DB_PASSWORD:?set GAMER_DB_PASSWORD in .env}@gamer-db:5432/gamer
      - OPENGYM_INTERNAL_URL=http://api:3000
      - DATA_DIR=/data
      - INTERNAL_SECRET=${INTERNAL_SECRET:?set INTERNAL_SECRET in .env}
    volumes:
      - ./data:/data:ro      # read-only: only openGym's server.js ever writes here

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
      gamer-api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

volumes:
  gamer_pgdata:
